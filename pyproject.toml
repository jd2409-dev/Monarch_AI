[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-mythos-ehra"
version = "0.1.0"
description = "Monarch AI SOMA-Mythos-EHRA grid reasoning architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
monarch-ai = "soma_mythos_ehra.cli:main"

[tool.setuptools.packages.find]
include = ["soma_mythos_ehra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
